[package]
name = "pasaree-backend-service"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "uuid", "chrono"] }
jsonwebtoken = "9"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
